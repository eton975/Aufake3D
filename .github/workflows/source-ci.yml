name: Aufake3D Win32 source builds and cross-OS reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Exact tool versions on both host operating systems, not latest-in-PATH.
  A3D_CI_LLVM: '19.1.7'
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '1767225600'

jobs:
  windows-and-linux:
    name: Build Win32 PE on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'
      - name: Install pinned LLVM on both platforms
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '19.1.7'
      - name: Install CMake/Ninja/C++ test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Verify LLVM and build prerequisites
        run: python scripts/build.py --doctor
      - name: Reject tracked prebuilt files
        run: python Tools/verify_source_only.py
      - name: Build Win32 components, run tests and verify three local builds
        run: python scripts/build.py --require-native-mock --require-acoustics
      - name: Assert local three-build verification
        run: python scripts/verify_reproducible.py --check-report
      - name: Record build evidence and exact source/PE/runtime hashes
        run: python scripts/verify_cross_platform.py emit --llvm 19.1.7 --out dist/manifest.json
      - name: Upload runtime and build evidence for the cross-OS release gate
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-cross-${{ runner.os }}
          path: |
            dist/Aufake3D_v0.9.2_Local_Runtime.zip
            dist/Aufake3D_Generated_PE_Evidence.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload individual binaries and local verification for diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-debug-${{ runner.os }}
          path: |
            dist/core/a3d.dll
            dist/core/a3dapi.dll
            dist/miles-local/mss32.dll
            dist/core/local-build-manifest.json
            dist/REPRODUCIBILITY_VERIFIED.json
          if-no-files-found: error

  cross-platform-byte-identity:
    name: Certify Windows/Linux PE and complete ZIP byte identity
    needs: windows-and-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@v7
        with:
          name: Aufake3D-cross-Windows
          path: verification/windows
      - uses: actions/download-artifact@v7
        with:
          name: Aufake3D-cross-Linux
          path: verification/linux
      - name: Fail unless both OS artifacts are exactly identical
        run: python scripts/verify_cross_platform.py compare --windows verification/windows --linux verification/linux --out verification/CROSS_PLATFORM_REPRODUCIBILITY_VERIFIED.json --expected-commit "${{ github.sha }}"
      - name: Upload cross-platform verification certificate
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-cross-platform-verified
          path: verification/CROSS_PLATFORM_REPRODUCIBILITY_VERIFIED.json
          if-no-files-found: error

name: Aufake3D four-target Win32 byte-identical builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Exact tool versions on both host operating systems, not latest-in-PATH.
  A3D_CI_LLVM: '19.1.7'
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '1767225600'

jobs:
  windows-and-linux:
    name: Build Win32 PE on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: '3.13.7'
      - name: Install pinned uv (Linux Python installer)
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.0'
      - name: Install and activate exact Python 3.13.7 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci_install_pinned_python.sh
      - name: Verify the active Python is exactly 3.13.7
        run: python -c "import sys; assert sys.version_info[:3] == (3, 13, 7), sys.version; print(sys.version)"
      - name: Install pinned LLVM on both platforms
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '19.1.7'
          # Keep the 19.1.7 toolchain OUTSIDE the source checkout. The
          # three-build proof copies project source; LLVM is a build input.
          directory: ${{ runner.temp }}/aufake3d-llvm
      - name: Install CMake/Ninja/C++ test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ curl xz-utils
      - name: Prepare pinned legacy libxml2 for LLVM on Ubuntu 26.04
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: bash scripts/ci_prepare_llvm_compat.sh "${{ runner.temp }}/aufake3d-libxml2-legacy"
      - name: Verify LLVM and build prerequisites
        run: python scripts/build.py --doctor
      - name: Reject tracked prebuilt files
        run: python Tools/verify_source_only.py
      - name: Build Win32 components, run tests and verify three local builds
        run: python scripts/build.py --require-native-mock --require-acoustics
      - name: Assert local three-build verification
        run: python scripts/verify_reproducible.py --check-report
      - name: Record build evidence and exact source/PE/runtime hashes
        run: python scripts/verify_cross_platform.py emit --llvm 19.1.7 --target ${{ matrix.os }} --out dist/manifest.json
      - name: Upload runtime and build evidence for the cross-OS release gate
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-cross-${{ matrix.os }}
          path: |
            dist/Aufake3D_v0.9.2_Local_Runtime.zip
            dist/Aufake3D_Generated_PE_Evidence.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload individual binaries and local verification for diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-debug-${{ matrix.os }}
          path: |
            dist/core/a3d.dll
            dist/core/a3dapi.dll
            dist/miles-local/mss32.dll
            dist/core/local-build-manifest.json
            dist/REPRODUCIBILITY_VERIFIED.json
          if-no-files-found: error

  ubuntu-2610-container:
    name: Build Win32 PE inside pinned Ubuntu 26.10 container
    # GitHub provides ubuntu-26.04, not ubuntu-26.10, as a hosted VM label.
    # Explicit image digest prevents the 26.10 rootfs changing under this job.
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.10@sha256:262df65c0ec6bf8d9dcc87454f4330a05fae4b97825f45854af3b136666584c2
      options: --platform linux/amd64
    steps:
      - name: Bootstrap native Ubuntu 26.10 build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git tar gzip xz-utils libstdc++6 libtinfo6 python3 cmake ninja-build g++
      - uses: actions/checkout@v7
      - name: Install pinned uv (Ubuntu 26.10 Python installer)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.0'
      - name: Install and activate exact Python 3.13.7 on Ubuntu 26.10
        shell: bash
        run: bash scripts/ci_install_pinned_python.sh
      - name: Verify the active Python is exactly 3.13.7
        run: python -c "import sys; assert sys.version_info[:3] == (3, 13, 7), sys.version; print(sys.version)"
      - name: Install pinned LLVM on Ubuntu 26.10
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '19.1.7'
          # Keep the 19.1.7 toolchain OUTSIDE the source checkout. The
          # three-build proof copies project source; LLVM is a build input.
          directory: ${{ runner.temp }}/aufake3d-llvm
      - name: Prepare pinned legacy libxml2 for LLVM inside Ubuntu 26.10
        shell: bash
        run: bash scripts/ci_prepare_llvm_compat.sh "${{ runner.temp }}/aufake3d-libxml2-legacy"
      - name: Confirm real Ubuntu 26.10 environment and pinned LLVM
        run: python scripts/build.py --doctor
      - name: Reject tracked prebuilt files
        run: python Tools/verify_source_only.py
      - name: Build Win32 components and verify three independent builds
        run: python scripts/build.py --require-native-mock --require-acoustics
      - name: Assert local three-build verification
        run: python scripts/verify_reproducible.py --check-report
      - name: Record Ubuntu 26.10 evidence and verify OS identity
        run: python scripts/verify_cross_platform.py emit --llvm 19.1.7 --target ubuntu-26.10 --out dist/manifest.json
      - name: Upload Ubuntu 26.10 binary evidence
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-cross-ubuntu-26.10
          path: |
            dist/Aufake3D_v0.9.2_Local_Runtime.zip
            dist/Aufake3D_Generated_PE_Evidence.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30

  cross-platform-byte-identity:
    name: Certify identical Win32 outputs on Windows and all Ubuntu targets
    needs: [windows-and-linux, ubuntu-2610-container]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned uv for certification job
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.0'
      - name: Install and activate exact Python 3.13.7 for certification
        shell: bash
        run: bash scripts/ci_install_pinned_python.sh
      - name: Verify the active Python is exactly 3.13.7
        run: python -c "import sys; assert sys.version_info[:3] == (3, 13, 7), sys.version; print(sys.version)"
      - uses: actions/download-artifact@v7
        with:
          name: Aufake3D-cross-windows-2022
          path: verification/windows
      - uses: actions/download-artifact@v7
        with:
          name: Aufake3D-cross-ubuntu-24.04
          path: verification/ubuntu-24.04
      - uses: actions/download-artifact@v7
        with:
          name: Aufake3D-cross-ubuntu-26.04
          path: verification/ubuntu-26.04
      - uses: actions/download-artifact@v7
        with:
          name: Aufake3D-cross-ubuntu-26.10
          path: verification/ubuntu-26.10
      - name: Fail unless Windows and ALL Ubuntu artifacts are byte-identical
        run: >-
          python scripts/verify_matrix_reproducibility.py
          --windows verification/windows
          --linux-target ubuntu-24.04=verification/ubuntu-24.04
          --linux-target ubuntu-26.04=verification/ubuntu-26.04
          --linux-target ubuntu-26.10=verification/ubuntu-26.10
          --out verification/CROSS_PLATFORM_REPRODUCIBILITY_VERIFIED.json
          --expected-commit "${{ github.sha }}"
      - name: Upload cross-platform verification certificate
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-cross-platform-verified
          path: verification/CROSS_PLATFORM_REPRODUCIBILITY_VERIFIED.json
          if-no-files-found: error

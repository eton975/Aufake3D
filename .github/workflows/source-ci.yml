name: Aufake3D local-equivalent Win32 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-and-linux:
    name: Build Win32 PE on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install LLVM and CMake/Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake ninja-build g++
      - name: Install/verify LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -or -not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
            "C:\Program Files\LLVM\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          }
      - name: Check prerequisites
        run: python scripts/build.py --doctor
      - name: Reject tracked prebuilt files
        run: python Tools/verify_source_only.py
      - name: Build all Win32 components, run tests, assemble game kits
        run: python scripts/build.py --require-native-mock --require-acoustics
      - name: Assert verified runtime manifest was created and matches outputs
        run: python scripts/verify_reproducible.py --check-report
      - name: Upload compiled Windows runtime
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-Win32-${{ runner.os }}-${{ github.run_number }}
          path: dist/Aufake3D_v0.9.1_Local_Runtime.zip
          if-no-files-found: error
      - name: Upload individual DLLs for inspection
        uses: actions/upload-artifact@v7
        with:
          name: Aufake3D-DLLs-${{ runner.os }}-${{ github.run_number }}
          path: |
            dist/core/a3d.dll
            dist/core/a3dapi.dll
            dist/miles-local/mss32.dll
            dist/core/local-build-manifest.json
            dist/REPRODUCIBILITY_VERIFIED.json
          if-no-files-found: error

name: Aufake3D source build and docs tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux-win32-crossbuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake ninja-build python3
      - name: Verify source manifest and no prebuilt binaries
        run: |
          python3 Tools/verify_source_manifest.py
          python3 Tools/verify_source_only.py
      - name: Source + documentation contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Win32 A3D core
        run: python3 scripts/build_engine.py
      - name: Compare pinned binary hashes
        run: python3 Tools/check_core_binary_hashes.py
      - name: Rebuild vendor-free Miles proxy
        run: python3 Source/Alice2011_NameFix_v089/build_proxy_from_export_map.py --output ./dist/miles-repro
      - name: Test acoustics library
        run: |
          cmake -S Source/Engine/acoustics -B build/acoustics -G Ninja
          cmake --build build/acoustics
          ctest --test-dir build/acoustics --output-on-failure
